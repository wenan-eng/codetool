        - generic [ref=e282]:
          - heading "🆔 支持15位和18位两种身份证号码格式吗？" [level=3] [ref=e283]
          - paragraph [ref=e284]: 完全支持。工具同时兼容第一代15位与第二代18位居民身份证号码格式，系统会自动识别号码长度并采用对应的解析规则。无论输入哪种格式，均可正常提取出生日期、性别、年龄、地区、生肖、星座等全部信息，且15位号码会自动补全年份前缀，确保提取结果准确无误，适配不同历史时期的证件数据整理需求。
        - generic [ref=e285]:
          - heading "📅 提取年龄时，是按公历计算还是农历计算？" [level=3] [ref=e286]
          - paragraph [ref=e287]: 年龄统一按公历周岁计算。系统根据身份证号码中的出生日期与当前系统日期进行差值运算，精准得出周岁年龄。选择"提取年龄（精确到天）"模式时，还会额外显示剩余天数，便于精确统计。生肖提取则采用农历年份规则，星座按公历日期划分，各类提取逻辑均严格遵循通用标准，确保结果合规准确。
        - generic [ref=e288]:
          - heading "📍 地址码提取能精确到哪一级行政区划？" [level=3] [ref=e289]
          - paragraph [ref=e290]: 地址码提取可精确到省级行政区划（省、自治区、直辖市）。系统根据身份证号码前两位数字自动匹配对应的省级地区名称，如"11"对应北京市、"44"对应广东省等。虽无法进一步细化到市、区级，但已覆盖全国所有省级行政单位，满足大多数数据归档、区域统计等场景需求，匹配快速准确，便于批量整理与分析。
