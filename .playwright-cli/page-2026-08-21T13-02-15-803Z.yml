      - generic [ref=e276]:
        - heading "常见问题" [level=2] [ref=e277]:
          - img [ref=e278]
          - text: 常见问题
        - generic [ref=e282]:
          - heading "🖼️ 支持哪些图片格式？上传后图片会泄露吗？" [level=3] [ref=e283]
          - paragraph [ref=e284]: 支持 PNG、JPG、JPEG、GIF、WebP、BMP 等主流图片格式。所有图片加载、隐写嵌入、预览、下载均在您本地浏览器内完成，全程不上传任何数据至服务器，关闭页面后所有数据自动清除，无缓存、无残留，充分保障您的图片隐私安全。
        - generic [ref=e285]:
          - heading "📝 一张图片最多能隐藏多少文字？如何计算？" [level=3] [ref=e286]
          - paragraph [ref=e287]: 隐藏容量取决于图片尺寸，计算公式为：宽 × 高 × 3 ÷ 16（每个像素有RGB三个通道，每个通道隐藏1位，每个字符占用16位）。例如：1920×1080的图片约可隐藏38.8万字符，512×512的图片约可隐藏4.9万字符。上传图片后系统会自动计算并显示上限，文本框也会同步限制输入长度。
        - generic [ref=e288]:
          - heading "🔒 隐写后的图片和原图有区别吗？肉眼能看出来吗？" [level=3] [ref=e289]
          - paragraph [ref=e290]: 几乎无区别。LSB（最低有效位）算法只修改像素 RGB 通道的最后一位二进制数，对颜色影响极小，人眼完全无法察觉任何差异，视觉上与原图毫无二致。只有通过专门的提取工具才能准确读出隐藏信息，普通图片查看软件打开后看到的依然是完全正常的原始画面，隐蔽性极强，第三方根本无法感知其中藏有秘密。
        - generic [ref=e291]:
          - heading "⚠️ 为什么必须保存为 PNG 格式？JPG 不行吗？" [level=3] [ref=e292]
          - paragraph [ref=e293]: PNG 是无损压缩格式，能完整保留像素的每一位数据，确保隐藏信息不被破坏，是 LSB 隐写的理想载体。而 JPG/JPEG 是有损压缩格式，保存时会重新编码并改变像素值，会直接损坏 LSB 数据，导致文字无法提取甚至完全丢失。因此隐写图片请务必保存为 PNG 格式，切勿转换为 JPG，否则隐藏信息将永久损毁。
        - generic [ref=e294]:
          - heading "🔐 隐写和加密有什么区别？可以一起使用吗？" [level=3] [ref=e295]
          - paragraph [ref=e296]: 隐写是隐藏信息的存在（别人不知道有秘密），加密是让信息变得不可读（别人知道有密文但看不懂）。强烈建议先对敏感信息进行加密，再将密文嵌入图片，实现“加密+隐写”双重保护，即使被人发现图片中藏有信息，提取出来的也是密文，仍需密钥才能解读。
