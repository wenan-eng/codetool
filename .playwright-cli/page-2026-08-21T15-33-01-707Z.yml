          - strong [ref=e182]: 文本输入
        - paragraph [ref=e183]: 在【请输入身份证号列表】输入框中，可直接粘贴或手动输入多个身份证号码。支持单个输入、多行换行分隔、空格或逗号分隔的批量格式（如：330421197402080974,110101199003072315），系统将自动提取所有符合标准的18位身份证号码，非身份证内容将被智能忽略。
        - paragraph [ref=e184]:
          - text: 🚀
          - strong [ref=e185]: 智能提取
        - paragraph [ref=e186]: 点击“开始生成”按钮，系统将对输入的身份证号进行合法性校验与出生日期解析，并调用农历库精确转换为对应的农历信息。每条有效身份证号将生成完整的出生日期分析结果，包括阳历、农历、星期、生肖与星座等字段，数据全程本地处理，无需联网，安全高效。
        - paragraph [ref=e187]:
          - text: 🔍
          - strong [ref=e188]: 查看示例
        - paragraph [ref=e189]: 点击“查看示例”按钮，系统将自动填充一组典型身份证号样本并执行解析操作，展示完整输出效果。示例包含常见年份与性别分布，帮助你快速了解工具的解析能力与表格呈现方式，便于确认使用流程与结果准确性。
        - paragraph [ref=e190]:
          - text: 📥
          - strong [ref=e191]: 下载Excel
        - paragraph [ref=e192]: "点击“下载EXCEL”按钮，系统会将当前分析结果导出为 `.xlsx` 格式文件，文件名自动包含当前日期与记录数量（如：身份证分析结果_2025-04-05.xlsx）。文件结构清晰，适配 Excel 打开，可用于归档、统计或导入其他办公系统。"
        - paragraph [ref=e193]:
          - text: 📋
          - strong [ref=e194]: 复制结果
        - paragraph [ref=e195]: 解析完成后，所有结果实时显示在下方表格中。点击“复制结果”按钮，即可一键将完整数据（含表头）以制表符分隔的文本格式复制到剪贴板，方便粘贴至 Excel、WPS 或数据库导入工具中，实现无缝流转与二次处理。
        - paragraph [ref=e196]:
          - text: 🗑️
          - strong [ref=e197]: 清空数据
        - paragraph [ref=e198]: 点击“清空数据”按钮，系统将清除输入框中的全部内容，并清空输出表格与内存中的结果数据，重置工具状态。整个过程不涉及任何网络请求，所有操作均在浏览器本地完成，保护隐私，安全无痕，可反复使用，适用于日常批量查询场景。
