      - generic [ref=e274]:
        - heading "常见问题" [level=2] [ref=e275]:
          - img [ref=e276]
          - text: 常见问题
        - generic [ref=e280]:
          - heading "🖼️ 经过修图软件处理过的图片还能提取出隐写文字吗？" [level=3] [ref=e281]
          - paragraph [ref=e282]: 大概率不能。任何改变像素值的操作都会破坏LSB数据，包括：调整亮度/对比度、添加滤镜、裁剪、缩放、重新压缩保存等。即使是轻微的色阶调整，也会覆盖RGB通道的最低有效位。只有未经任何二次编辑的原始PNG图片，才能保证隐写信息的完整可提取性。
        - generic [ref=e283]:
          - heading "📏 提取文字有长度限制吗？能提取多长的隐藏信息？" [level=3] [ref=e284]
          - paragraph [ref=e285]: 提取长度完全取决于图片像素数量。系统会逐像素扫描RGB三个通道，每16位解码一个字符，理论上可提取的字符数上限为：宽×高×3÷16。例如1920×1080的图片最多可提取约38万字符。实际提取结果以嵌入时的文字长度为准，系统会扫描至遇到结束标志为止，无额外限制。
        - generic [ref=e286]:
          - heading "🔍 提取出来的内容是乱码，是什么原因？" [level=3] [ref=e287]
          - paragraph [ref=e288]: 乱码通常有三种原因：一是该图片并未通过LSB算法隐藏文字，可能是普通图片或使用其他隐写工具生成；二是图片曾转换为JPG格式或被二次编辑、压缩，导致像素最低位数据已损坏；三是图片中确实藏有信息，但嵌入时使用了不同的编码规则。建议确认图片来源，并使用PNG无损格式保存隐写图片。
        - generic [ref=e289]:
          - heading "⚠️ 为什么上传图片后显示“该图片没有隐藏文字”？" [level=3] [ref=e290]
          - paragraph [ref=e291]: 这说明系统已完成LSB提取流程，但未在像素RGB通道的最低有效位中检测到有效的结束标志（连续16个0位）。可能原因：图片确实不包含任何隐写信息；图片经过社交软件转发后被压缩或重编码；隐写时使用了非标准算法。若您确信图片藏有文字，请尝试使用原图文件重新上传。
