          - img [ref=e299]
          - text: 常见问题
        - generic [ref=e303]:
          - heading "🔐 这个工具支持哪些AES加密模式？" [level=3] [ref=e304]
          - paragraph [ref=e305]: 本工具完整支持四种主流AES加密模式：CBC（推荐）、GCM（现代认证加密）、CTR 和 ECB。其中 CBC 模式适用于大多数数据加密场景；GCM 模式提供完整性校验，适合高安全需求环境；CTR 支持流式加密；ECB 虽然可用，但因安全性较低，系统已明确标注“不安全”，建议避免使用。
        - generic [ref=e306]:
          - heading "🔑 加密时如何正确设置密钥？有什么要求？" [level=3] [ref=e307]
          - paragraph [ref=e308]: 密钥是AES加密的核心参数，建议使用16、24或32位长度的字符串作为密钥，分别对应AES-128、AES-192和AES-256标准。输入过短或非标准长度的密钥可能导致加密失败。所有密钥内容仅在本地浏览器中处理，不会上传至任何服务器，保障用户密钥安全。
        - generic [ref=e309]:
          - heading "🔢 什么是初始向量（IV）？必须填写吗？" [level=3] [ref=e310]
          - paragraph [ref=e311]: 初始向量（IV）是CBC、GCM、CTR等加密模式中用于增强随机性的重要参数，可防止相同明文生成相同密文。在这些模式下必须填写合法的十六进制IV值。系统支持自动生成安全随机IV。而ECB模式不需要IV，选择该模式后IV输入框会自动隐藏，避免误操作。
        - generic [ref=e312]:
          - heading "📋 密文输出是什么格式？能直接用于其他系统吗？" [level=3] [ref=e313]
          - paragraph [ref=e314]: 加密结果默认以JSON格式输出，包含密文、IV、加密模式等关键信息，便于后续解密使用。同时支持纯Base64密文输出，确保与其他平台、接口系统的兼容性。用户可根据需要复制任意一种格式进行传输或存储。
