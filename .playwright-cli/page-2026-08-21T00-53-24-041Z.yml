            - code [ref=e321]: /
            - text: ","
            - code [ref=e322]: "?"
            - text: ","
            - code [ref=e323]: "#"
            - text: 等结构字符；而
            - code [ref=e324]: encodeURIComponent
            - text: 会对所有特殊字符编码，更适合用于参数值。本工具使用的是
            - strong [ref=e325]: encodeURIComponent
            - text: 标准，符合大多数开发场景需求。
