        - generic [ref=e287]:
          - heading "✔️ 什么是文本自动排版工具？它主要解决什么问题？" [level=3] [ref=e288]
          - paragraph [ref=e289]: 文本自动排版工具是一款智能格式处理工具，能够自动对杂乱文本进行分段、清理和格式化。主要解决网页复制文本的HTML残留、社交媒体文本的表情符号混杂、文档格式不规范、段落结构不清晰等常见排版问题，让文本恢复整洁专业的可读状态。
        - generic [ref=e290]:
          - heading "📌 智能分段是如何工作的？它会随意分割我的文本吗？" [level=3] [ref=e291]
          - paragraph [ref=e292]: 智能分段基于语义分析算法工作，通过识别话题转换词（如"但是"、"此外"）、总结性词语（如"总之"、"因此"）以及控制段落长度（每段3-6句）来实现合理分段。它不会随意分割，而是根据文本内容逻辑进行智能判断，确保分段后的文本结构更加清晰易读。
        - generic [ref=e293]:
          - heading "🎯 哪些情况下需要使用\"去除HTML标签\"功能？" [level=3] [ref=e294]
          - paragraph [ref=e295]:
            - text: 当您从网页、博客、新闻网站或在线文档复制内容时，文本中常常会包含
            - strong [ref=e296]: <b>、<p>、<div>、<span>
            - text: 等HTML标签。勾选此功能可一键清除所有HTML标记，获得纯净的文本内容，适用于需要粘贴到纯文本编辑器、邮件正文或打印文档的场景。
