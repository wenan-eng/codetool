          - strong [ref=e180]: 文本转十六进制
        - paragraph [ref=e181]: 点击 "开始转换" 按钮后，系统将自动对输入文本内的每一个字符进行完整解析，基于 Unicode 字符编码标准转换为对应的 2 位（单字节字符）或多字节十六进制编码，并采用空格作为固定分隔符来清晰区分每个字符的编码。例如：字符 "A" 转换结果为 "41"，中文汉字 "好" 转换结果为 "597D"。
