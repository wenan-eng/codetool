        - generic [ref=e273]:
          - heading "✔️ MD4加密是什么？" [level=3] [ref=e274]
          - paragraph [ref=e275]: 本工具支持四种标准 MD4 加密格式，包含 32 位小写、32 位大写、16 位小写、16 位大写，全程遵循通用哈希规范生成。32 位为完整标准摘要，严格符合 RFC 1320 官方规范，16 位为常用中间截取格式，可灵活适配不同开发环境、数据库存储与老旧接口对接的多样格式需求。
        - generic [ref=e276]:
          - heading "📌 这个工具支持哪些MD4格式输出？" [level=3] [ref=e277]
          - paragraph [ref=e278]: 本工具支持四种标准 MD4 加密格式，包括 32 位小写、32 位大写、16 位小写、16 位大写，全部遵循通用哈希规则原生运算生成。32 位为完整标准摘要，严格符合 RFC 1320 官方规范；16 位为行业通用中间截取格式，适配老旧系统兼容场景，可灵活满足不同开发环境、精简数据库存储与各类旧接口对接的专属格式需求。
        - generic [ref=e279]:
          - heading "🎯 MD4加密是否可逆？" [level=3] [ref=e280]
          - paragraph [ref=e281]: MD4 属于单向散列算法，理论上无法通过摘要反向还原原始明文，不支持真正意义上的逆向解密。但由于 MD4 安全性极低、极易被碰撞破解，在实际应用中早已没有安全保障，攻击者可快速构造出相同哈希值的伪造内容，因此绝对不能用于身份验证、密码存储等敏感核心场景。
        - generic [ref=e282]:
          - heading "🔭 MD4加密的主要用途是什么？" [level=3] [ref=e283]
          - paragraph [ref=e284]: MD4 目前仅用于老旧系统兼容、历史协议对接、非敏感数据校验、日常开发调试等低安全场景。该算法早已被业内破解，完全不具备抗撞防护能力，绝对不可用于数据加密、签名验证与账号密码存储等高风险场景，正规项目开发都会优先改用 SHA-256 这类安全可靠的主流哈希算法。
        - generic [ref=e285]:
          - heading "🔒 我的输入内容会保存在服务器吗？" [level=3] [ref=e286]
          - paragraph [ref=e287]: 不会。本 MD4 加密工具所有计算全程在浏览器本地独立完成，无需联网操作，全程不产生网络传输。原始文本不会发送、记录或缓存到任何服务器，全程严格保护隐私。所有操作仅在本地执行，关闭页面后所有数据即刻彻底清空消失，全方位保障您的输入内容安全与隐私。
