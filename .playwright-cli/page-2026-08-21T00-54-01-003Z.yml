            - text: （0-9）以及
            - strong [ref=e301]: 常用标点符号
            - text: （如
            - code [ref=e302]: .
            - text: ","
            - code [ref=e303]: ","
            - text: ","
            - code [ref=e304]: "?"
            - text: ","
            - code [ref=e305]: "!"
            - text: ","
            - code [ref=e306]: /
            - text: ","
            - code [ref=e307]: "@"
            - text: 等）。请注意，摩斯密码
            - strong [ref=e308]: 不支持中文、日文、韩文等非拉丁字符
            - text: ，如需编码这些语言，需要先转换为拼音或罗马字。
