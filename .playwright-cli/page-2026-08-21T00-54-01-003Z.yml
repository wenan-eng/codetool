          - paragraph [ref=e294]:
            - text: 摩斯密码（Morse Code）是一种通过短信号（点 "."）和长信号（划 "-"）的不同组合来表示字母、数字和标点符号的编码系统。每个字符由点和划的序列表示，字母之间用空格分隔，单词之间用
            - code [ref=e295]: /
            - text: 分隔。它最初用于电报通信，现在常用于业余无线电、求救信号（SOS）和学习密码学基础知识。
