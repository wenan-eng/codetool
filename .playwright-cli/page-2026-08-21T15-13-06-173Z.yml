        - paragraph [ref=e190]:
          - text: 🔄
          - strong [ref=e191]: 智能替换与格式清理
        - paragraph [ref=e192]: 通过顶部下拉菜单选择所需操作模式，系统将自动对输入文本执行精准替换或格式优化：
        - list [ref=e193]:
          - listitem [ref=e194]:
            - strong [ref=e195]: 合并连续空格
            - text: ：将两个及以上连续的普通空格压缩为单个空格，适用于清理因复制、换行导致的多余空白问题。
          - listitem [ref=e196]:
            - strong [ref=e197]: 删除所有空格
            - text: ：移除文本中全部半角空格（保留制表符和换行），常用于生成紧凑字符串或特殊编码场景。
          - listitem [ref=e198]:
            - strong [ref=e199]: 合并连续空行
            - text: ：将三个及以上连续的空行（含仅含空白字符的行）合并为一个有效空行（即两个换行符），提升文档排版整洁度。
          - listitem [ref=e200]:
            - strong [ref=e201]: 删除所有空行
            - text: ：彻底清除所有空白行，适用于清洗从网页、PDF 复制来的冗余段落间隔。
          - listitem [ref=e202]:
            - strong [ref=e203]: 英文全大写 / 全小写
            - text: ：一键统一英文字母大小写状态，便于标准化字段命名、标题格式或接口参数规范。
          - listitem [ref=e204]:
            - strong [ref=e205]: 英文首字母大写
            - text: ：自动识别单词边界，将每个单词首字母转为大写，其余小写，适合文章标题、展示文案美化。
          - listitem [ref=e206]:
            - strong [ref=e207]: 自定义查找替换
            - text: ：选择该模式后，在下方“查找目标”与“替换内容”中填写关键词，系统将全局精确替换所有匹配项，支持批量修改变量名、术语统一、敏感词过滤等高级需求。
        - paragraph [ref=e208]:
          - text: 🔄
          - strong [ref=e209]: 自定义查找替换
        - paragraph [ref=e210]: 选择【自定义】模式，在 “查找目标” 和 “替换内容” 输入框中分别填写需匹配的文本与替换结果，系统将全局精确替换所有匹配项。支持常见文本替换需求，如批量修改变量名、替换敏感词、统一术语表达等。
