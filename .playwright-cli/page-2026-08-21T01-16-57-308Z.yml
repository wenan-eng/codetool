        - generic [ref=e295]:
          - heading "📌 工具支持哪些内容转换？支持中文和特殊符号吗？" [level=3] [ref=e296]
          - paragraph [ref=e297]: 本工具支持中英文、数字、符号、空格、特殊字符、代码片段等各类常见文本内容的Base32编码与解码。编码采用标准UTF-8格式，可正常识别并转换中文、标点、特殊符号，解码时能准确还原为原始内容，不会出现乱码或丢失信息。
        - generic [ref=e298]:
          - heading "🎯 “Base32编码/解码”具体是如何工作的？结果标准吗？" [level=3] [ref=e299]
          - paragraph [ref=e300]: Base32编码会将输入文本转为符合RFC4648规范的字符串，仅包含大写字母A‑Z、数字2‑7与补全符；解码则反向还原为可读文本。工具自动过滤无效字符、多余空格与换行，保证输出结果纯净标准，与各类系统、接口、代码完全兼容。
        - generic [ref=e301]:
          - heading "📘 转换结果准确吗？会不会出现解码失败或乱码？" [level=3] [ref=e302]
          - paragraph [ref=e303]: 本工具基于标准Base32算法实现，转换结果稳定可靠。只要输入内容合法、未被篡改破坏，即可正常编码和解码。解码失败通常是因为内容不合法、被修改或包含非Base32字符，工具会自动识别并保证有效内容正常还原。
