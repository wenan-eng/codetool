        - paragraph [ref=e186]: 在【请输入要提取邮箱的文本（智能去重）】输入框中，可直接粘贴或手动输入包含邮箱地址的任意文本内容。支持邮件正文、网页源码、文档段落、通讯录列表、社交媒体文本等任何包含电子邮件地址的混合内容，系统将智能识别并提取所有邮箱，非邮箱文本内容不会影响提取结果。
        - paragraph [ref=e187]:
          - text: 🚀
          - strong [ref=e188]: 智能提取
        - paragraph [ref=e189]: 点击“智能提取”按钮，系统将自动扫描输入文本中的所有标准邮箱地址格式（如：user@domain.com、name+tag@sub.domain.cn），识别后输出全部发现的邮箱。系统会自动进行去重处理（不区分大小写），确保结果列表中每个邮箱地址只出现一次，适用于数据清洗、联系人整理等场景。
        - paragraph [ref=e190]:
          - text: 🔍
          - strong [ref=e191]: 查看示例
        - paragraph [ref=e192]: 点击“查看示例”按钮时，系统将自动填充一个包含多种邮箱格式的典型示例文本（如：联系 support@example.com，销售：sales@company.cn，重复邮箱：Support@Example.COM），并立即执行智能提取操作，展示自动去重后的邮箱列表结果，帮助你快速了解提取效果与使用流程。
        - paragraph [ref=e193]:
          - text: 📥
          - strong [ref=e194]: 下载TXT
        - paragraph [ref=e195]:
          - text: 点击“下载TXT”按钮，系统会将当前提取结果保存为纯文本文件（.txt格式），文件名自动包含时间戳与邮箱数量信息（如：
          - code [ref=e196]: 提取的邮箱列表-20251222.txt
          - text: ）。文件内容为每行一个邮箱地址的清晰列表，方便导入通讯录、邮件客户端或作为数据备份使用。
        - paragraph [ref=e197]:
          - text: 📋
          - strong [ref=e198]: 复制结果
        - paragraph [ref=e199]: 提取完成后，所有去重后的邮箱地址将实时显示在下方输出区域中，并在顶部显示提取总数。你可以手动选中内容进行复制，或直接点击“复制结果”按钮，一键将完整的邮箱列表复制到剪贴板，方便粘贴至Excel表格、邮件收件人栏或其他需要批量处理邮箱的工具中。
        - paragraph [ref=e200]:
          - text: 🗑️
          - strong [ref=e201]: 清空数据
        - paragraph [ref=e202]: 点击“清空数据”按钮可同时清除输入框与输出区域的所有内容，重置邮箱计数为0，但保持结果区域可见以备下次使用。所有提取过程均在浏览器本地完成，无需上传文本到服务器，不发送任何网络请求，保护用户隐私，安全无痕，可反复使用。
