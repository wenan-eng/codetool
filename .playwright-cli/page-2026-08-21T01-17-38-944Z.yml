        - generic [ref=e282]:
          - heading "⏱️ 破解预估时间是基于什么速率计算的？" [level=3] [ref=e283]
          - paragraph [ref=e284]: 工具采用常见破解速率10^10次/秒（即每秒尝试100亿次组合）进行估算，该速率接近专业攻击设备或分布式破解能力。实际破解时间受硬件性能、攻击方式等因素影响，本估算仅供参考。时间单位覆盖秒、分钟、小时、天、年、百年、千年、万年、亿年直至万亿年，以整数形式直观展示。
        - generic [ref=e285]:
          - heading "📊 熵值多少比特才算安全？" [level=3] [ref=e286]
          - paragraph [ref=e287]: 一般建议密码熵值不低于60比特。熵值36比特以下属于弱密码（极易被破解），36~60比特为中等强度（可接受），60~90比特为强密码（较安全），90比特以上为非常强密码（极难破解）。熵值越高，暴力破解所需时间越长，例如60比特约需数年，80比特则需数万年，建议重要账号选择强密码或非常强密码等级。
        - generic [ref=e288]:
          - heading "🔄 密码为空时为什么所有指标归零？" [level=3] [ref=e289]
          - paragraph [ref=e290]: 当输入框为空时，工具会自动重置所有显示指标，包括长度归0、池大小归0、熵值归0.0、组合数归0、破解时间显示“--”，熵值带恢复为默认提示文案。这样设计是为了让界面始终保持初始状态，避免残留历史数据造成误解，也方便您重新开始评估新密码，无需手动刷新页面。
        - generic [ref=e291]:
          - heading "🔢 字符池大小是如何计算的？" [level=3] [ref=e292]
          - paragraph [ref=e293]: 工具会自动分析密码中实际出现的字符类型，包括小写字母a-z（26个）、大写字母A-Z（26个）、数字0-9（10个）以及特殊符号（每个不重复符号计1个）。例如密码同时包含大小写字母和数字，池大小为62；若还使用了2种特殊符号，池大小则为64。池大小越大，同等长度下熵值越高，密码越安全。
        - generic [ref=e294]:
