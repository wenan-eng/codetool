          - paragraph [ref=e296]: 不会。本工具所有计算逻辑均在本地浏览器完成，不发送任何网络请求，不记录、不上传任何密码内容，断网状态下也能正常使用。您输入的密码仅保存在当前页面的内存中，关闭页面或刷新即自动清空，最大限度保障密码隐私与数据安全，可放心使用。
