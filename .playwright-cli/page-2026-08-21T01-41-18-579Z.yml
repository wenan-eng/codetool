          - heading "📋 输入多行时，空行和空白行会如何处理？" [level=3] [ref=e327]
          - paragraph [ref=e328]:
            - text: 系统按换行符（
            - code [ref=e329]: \n
            - text: ）严格分割每一行： • 完全为空的行（仅换行符）→ 输出对应空行； • 仅含空格、制表符等空白字符的行 → 视为无效内容，输出对应空行； • 非空行（含任意可见字符）→ 正常参与MD5计算。 输入与输出行数始终一一对应，确保批量处理时位置关系不丢失。
        - generic [ref=e330]:
          - heading "⚡ 计算速度很快，是用了Web Crypto API吗？" [level=3] [ref=e331]
          - paragraph [ref=e332]:
            - text: 不是。由于浏览器原生
            - code [ref=e333]: SubtleCrypto
            - text: 已禁用MD5（出于安全策略），本工具采用轻量级纯JS实现的MD5算法（基于CryptoJS核心逻辑），全程在主线程同步执行。单次千行以内计算耗时通常低于50ms，无阻塞、无异步延迟，响应即时，体验流畅。
        - generic [ref=e334]:
          - heading "📁 下载的TXT文件名为什么带时间戳？可以改名吗？" [level=3] [ref=e335]
          - paragraph [ref=e336]:
            - text: 文件下载的名称格式为
            - code [ref=e337]: md5_YYYYMMDD_HHMMSS.txt
            - text: （如
            - code [ref=e338]: md5_20250405_143022.txt
            - text: ），由浏览器本地时间动态生成，确保每次下载文件名唯一，避免覆盖历史记录。下载后您可在操作系统中任意重命名，不影响文件内容与编码。
        - generic [ref=e339]:
          - heading "🔒 使用这个工具安全吗？我的数据会被上传或保存吗？" [level=3] [ref=e340]
          - paragraph [ref=e341]: 绝对安全。所有操作均在您的浏览器内存中完成：输入文本不离开设备、MD5计算不调用任何网络请求、结果不写入本地存储（localStorage/indexedDB）、不触发任何第三方脚本。关闭页面后所有数据自动清除，真正实现「零上传、零留存、零追踪」，符合隐私保护最高要求。
