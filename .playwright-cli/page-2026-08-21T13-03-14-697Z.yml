          - text: 常见问题
        - generic [ref=e274]:
          - heading "📏 支持批量上传多少文件？有大小和格式限制吗？" [level=3] [ref=e275]
          - paragraph [ref=e276]: 本工具支持批量上传任意数量文件，支持任意格式。单个文件大小无强制限制，所有MD5哈希值计算均在您的浏览器本地实时完成。各类常见文件格式如文档、图片、音视频、压缩包、可执行程序等均可正常批量计算，稳定生成32位MD5哈希值。
        - generic [ref=e277]:
          - heading "📊 批量计算的结果如何查看和保存？" [level=3] [ref=e278]
          - paragraph [ref=e279]: 文件上传后，系统将以表格形式清晰展示每个文件的序号、文件名称、文件大小和MD5哈希值。您可点击「复制MD5值」按钮一键复制全部MD5值（每行一个），方便粘贴到文档或聊天窗口中；也可点击「导出Excel」按钮将完整列表导出为.xlsx文件，包含全部四列数据，便于存档备案、团队共享或二次整理。
        - generic [ref=e280]:
          - heading "🔐 什么是MD5哈希值？有什么用？" [level=3] [ref=e281]
          - paragraph [ref=e282]: MD5是一种广泛使用的密码散列函数，可为任意文件生成一个128位（32个十六进制字符）的唯一数字指纹。常用于验证文件完整性，例如下载软件安装包后对比官方提供的MD5值，确认文件在传输过程中未被篡改或损坏；也可用于批量判断多个文件是否与源文件完全一致，保障文件来源可靠、内容完整。
        - generic [ref=e283]:
          - heading "⚠️ 部分文件计算失败或显示“计算失败”是什么原因？" [level=3] [ref=e284]
          - paragraph [ref=e285]: 出现此类情况通常是该文件过大导致浏览器内存占用过高、文件本身已损坏无法正常读取，或浏览器版本过低不支持相关API。其他文件不受影响，仍会正常计算并显示结果。您可尝试单独上传失败的文件，刷新页面后重试，或升级浏览器至最新版本。建议使用Chrome、Edge等主流浏览器获得最佳体验。
        - generic [ref=e286]:
          - heading "🔒 我批量上传的文件会被上传或记录吗？是否安全？" [level=3] [ref=e287]
          - paragraph [ref=e288]: 完全不会！所有文件读取、MD5计算、表格生成、Excel导出均在您的浏览器本地实时完成，无需联网上传，不发送任何网络请求。您上传的所有文件、生成的MD5值、导出的表格数据等所有信息均不会离开您的设备，也不会被存储、记录或追踪，彻底保护您的文件安全与隐私。
