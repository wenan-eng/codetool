        - paragraph [ref=e175]:
          - text: 📁
          - strong [ref=e176]: 批量文件上传
        - paragraph [ref=e177]: 在文件上传区域，可直接点击选择或拖拽多个文件进行批量上传（支持任意格式文件）。系统支持批量文件同时处理，单个文件大小不限（本地浏览器解析），自动过滤文件夹，仅计算有效文件的MD5哈希值。所有计算均在浏览器本地完成，无需等待服务器处理，实时显示每个文件的计算结果。
        - paragraph [ref=e178]:
          - text: 📊
          - strong [ref=e179]: MD5列表生成
        - paragraph [ref=e180]: 文件上传成功后，系统将自动逐个计算并显示每个文件的MD5哈希值，以表格形式清晰展示序号、文件名称、文件大小和MD5值。MD5值作为文件的唯一数字指纹，可用于验证文件在传输、下载、存储过程中是否被篡改或损坏。计算结果精确到32位十六进制字符，支持批量留存或与官方提供的MD5值进行逐一比对。
        - paragraph [ref=e181]:
          - text: 📋
          - strong [ref=e182]: 复制全部MD5值
        - paragraph [ref=e183]: 点击 "复制MD5值" 按钮，可将当前列表中所有文件的MD5哈希值一键复制到系统剪贴板，每个MD5值占一行，方便你快速粘贴到文档、聊天窗口或校验记录中。复制成功后会有数量提示反馈，无需逐个手动选中复制，大幅提升批量操作效率。
        - paragraph [ref=e184]:
          - text: 📥
          - strong [ref=e185]: 导出Excel表格
        - paragraph [ref=e186]:
          - text: 点击 "导出Excel" 按钮，可将当前MD5列表一键导出为Excel文件（
          - code [ref=e187]: .xlsx
          - text: 格式）。导出内容包含序号、文件名称、文件大小和MD5值四列，文件名按日期自动命名，列宽自适应内容，下载即用，无需二次调整。适用于文件归档、批量校验记录留存、团队协作共享等场景。
        - paragraph [ref=e188]:
          - text: 🗑️
          - strong [ref=e189]: 清空数据
        - paragraph [ref=e190]: 点击 "清空数据" 按钮可同时清除已上传的所有文件、生成的MD5列表及表格数据，恢复工具初始状态。所有文件解析、MD5计算、表格生成、Excel导出均在浏览器本地完成，不上传任何文件到服务器，不产生网络请求，100%保护隐私，安全无痕。
