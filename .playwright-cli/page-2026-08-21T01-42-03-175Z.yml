      - generic [ref=e288]:
        - heading "常见问题" [level=2] [ref=e289]:
          - img [ref=e290]
          - text: 常见问题
        - generic [ref=e294]:
          - heading "🔐 这个工具生成的是什么格式的密码？" [level=3] [ref=e295]
          - paragraph [ref=e296]: 生成的是Apache/Nginx服务器HTTP基本认证使用的标准密码哈希格式，采用单行"用户名:加密密码"数据结构。可直接复制到服务器的.htpasswd配置文件中使用，支持HTTP Basic Auth身份验证协议，确保Web资源的安全访问控制。
        - generic [ref=e297]:
          - heading "📊 SHA-1、SHA-256、MD5算法有什么区别？" [level=3] [ref=e298]
          - paragraph [ref=e299]: "SHA-1输出格式为{用户名}:{SHA}base64哈希；SHA-256为{用户名}:{SHA256}base64哈希；MD5为{用户名}:$apr1$随机盐值$哈希。MD5每次生成结果不同但都有效，SHA算法相同密码结果固定。"
        - generic [ref=e300]:
          - heading "🎯 生成的密码哈希怎么使用？" [level=3] [ref=e301]
          - paragraph [ref=e302]: 复制生成的"用户名:加密密码"结果，添加到服务器的.htpasswd文件中（每行一个用户）。然后在Apache配置中使用AuthUserFile指令或在Nginx配置中使用auth_basic_user_file指令指向该文件，重启Web服务后即可启用HTTP基本身份验证机制。
        - generic [ref=e303]:
          - heading "📘 密码强度\"强\"就一定安全吗？" [level=3] [ref=e304]
          - paragraph [ref=e305]: 密码强度仅评估复杂度（长度、字符组合），但最终安全取决于加密算法的抗暴力破解能力。建议使用SHA-256算法配合高强度密码组合，即使密码哈希泄露，由于加密算法的单向性和加盐机制，攻击者也无法通过彩虹表或字典攻击反向推导原始密码。
        - generic [ref=e306]:
          - heading "⚡ 相同密码用不同算法生成，都能登录吗？" [level=3] [ref=e307]
          - paragraph [ref=e308]: 不能！服务器必须配置与生成时相同的加密算法及对应的认证模块。比如用SHA-1生成的密码，服务器必须配置AuthType Basic并启用SHA算法支持；用MD5生成的则需要Apache的mod_authn_file模块或Nginx对应的md5认证支持。算法不匹配会导致认证失败。
        - generic [ref=e309]:
          - heading "🔒 为什么推荐使用SHA-256而不是明文？" [level=3] [ref=e310]
          - paragraph [ref=e311]: 明文密码在配置文件中直接可见，任何人拿到配置文件就能登录。加密后的哈希无法反向推导出原密码，即使配置文件泄露，攻击者也无法直接使用。
