        - heading "常见问题" [level=2] [ref=e270]:
          - img [ref=e271]
          - text: 常见问题
        - generic [ref=e275]:
          - heading "📏 支持上传多大的文件？有格式限制吗？" [level=3] [ref=e276]
          - paragraph [ref=e277]: 本工具支持任意格式文件上传，文件大小无强制上限，所有MD5哈希值计算均在您的浏览器本地实时完成。为保证计算速度和页面响应流畅度，建议单文件不超过2GB，各类常见文件格式如文档、图片、音视频、压缩包、可执行程序等均可正常计算，稳定生成32位MD5哈希值。
        - generic [ref=e278]:
          - heading "🔐 什么是MD5哈希值？有什么用？" [level=3] [ref=e279]
          - paragraph [ref=e280]: MD5是一种广泛使用的密码散列函数，可为任意文件生成一个128位（32个十六进制字符）的唯一数字指纹。常用于验证文件完整性，例如下载软件安装包后对比官方提供的MD5值，确认文件在传输过程中未被篡改或损坏；也可用于判断两个文件是否完全一致，保障文件来源可靠、内容完整。
        - generic [ref=e281]:
          - heading "✅ 如何校验文件MD5值是否一致？" [level=3] [ref=e282]
          - paragraph [ref=e283]: 文件上传后系统自动生成MD5值，您在「校验对比」输入框中粘贴待比对的MD5值，系统将实时对比并显示「一致」或「不一致」的结果。比对时不区分大小写，支持直接粘贴从官网、下载站或其他渠道获取的MD5字符串，快速验证文件完整性与真实性。
        - generic [ref=e284]:
          - heading "⚠️ 计算失败或一直无响应是什么原因？" [level=3] [ref=e285]
          - paragraph [ref=e286]: 出现此类情况通常是文件过大导致浏览器内存占用过高、文件本身已损坏无法正常读取，或浏览器版本过低不支持相关API。您可以尝试更换较小文件测试，刷新页面后重新上传，或升级浏览器至最新版本。若问题持续，建议使用Chrome、Edge等主流浏览器获得最佳体验。
        - generic [ref=e287]:
          - heading "🔒 我上传的文件会被上传或记录吗？是否安全？" [level=3] [ref=e288]
          - paragraph [ref=e289]: 完全不会！所有文件读取、MD5计算、校验对比均在您的浏览器本地实时完成，无需联网上传，不发送任何网络请求。您上传的文件、生成的MD5值、输入的校验内容等所有信息均不会离开您的设备，也不会被存储、记录或追踪，彻底保护您的文件安全与隐私。
