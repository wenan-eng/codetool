        - paragraph [ref=e177]:
          - text: 📁
          - strong [ref=e178]: 文件上传
        - paragraph [ref=e179]: 在文件上传区域，可直接点击选择或拖拽要校验的文件（支持任意格式）。系统支持单个文件上传，文件大小不限（本地浏览器解析），自动计算文件MD5哈希值，生成32位十六进制字符串，无需等待服务器处理，实时显示计算结果。
        - paragraph [ref=e180]:
          - text: 🔐
          - strong [ref=e181]: MD5值生成
        - paragraph [ref=e182]: 文件上传成功后，系统将自动计算并显示文件的MD5哈希值。MD5值作为文件的唯一数字指纹，可用于验证文件在传输、下载、存储过程中是否被篡改或损坏。计算结果精确到32位十六进制字符，支持直接复制使用，方便你留存或与官方提供的MD5值进行比对。
        - paragraph [ref=e183]:
          - text: ✅
          - strong [ref=e184]: 校验对比
        - paragraph [ref=e185]: 在「校验对比」输入框中，可手动输入待比对的MD5值。系统将实时对比输入的MD5值与当前文件生成的MD5值是否一致，并显示「一致」或「不一致」的校验结果。适用于下载文件完整性验证、软件安装包校验、传输前后文件一致性检测等场景，确保文件来源可靠、内容完整。
        - paragraph [ref=e186]:
          - text: 📋
          - strong [ref=e187]: 复制MD5值
        - paragraph [ref=e188]: 点击「复制MD5值」按钮，可将当前文件生成的MD5哈希值一键复制到系统剪贴板。复制成功后会有提示反馈，方便你快速粘贴到其他文档、聊天窗口或校验记录中，无需手动选中复制，提升操作效率。
        - paragraph [ref=e189]:
          - text: 🗑️
          - strong [ref=e190]: 清空数据
        - paragraph [ref=e191]: 点击「清空数据」按钮可同时清除已上传的文件、生成的MD5值以及校验输入框中的内容，恢复工具初始状态。所有文件解析、MD5计算、校验对比均在浏览器本地完成，不上传任何文件到服务器，不产生网络请求，100%保护隐私，安全无痕。
