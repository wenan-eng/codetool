        - paragraph [ref=e175]:
          - text: 请在文本框中粘贴 Base64 编码字符串，支持纯 Base64 格式或带 Data URL 前缀的完整格式（如
          - code [ref=e176]: data:image/png;base64,...
          - text: ）。系统会自动清理换行符、空格等无效字符，粘贴后立即自动解析并识别文件类型，无需手动点击触发，操作便捷高效。
        - paragraph [ref=e177]:
          - text: 🔍
          - strong [ref=e178]: 智能识别
        - paragraph [ref=e179]: 系统自动解码并智能识别文件类型，实时显示文件大小（B/KB/MB）及标准 MIME 类型，同时计算解码后的原始数据字节数。若为图片格式，还会自动解析并展示图片尺寸（宽×高），并以直观形式呈现预览核对区域，方便快速验证解码结果是否正确无误。整个解析过程即时完成，无需等待，提升工作效率。
        - paragraph [ref=e180]:
          - text: 🏷️
          - strong [ref=e181]: 修改名称
        - paragraph [ref=e182]:
          - text: 系统会根据解码识别的文件类型自动生成带时间戳的默认文件名（如
          - code [ref=e183]: base64-1734567890123.png
          - text: ），确保每次输出文件名唯一不重复。您可直接修改文件名输入框中的内容，按需自定义输出文件的名称，无需手动填写扩展名，系统会自动匹配正确的后缀。
        - paragraph [ref=e184]:
          - text: 💾
          - strong [ref=e185]: 下载保存
        - paragraph [ref=e186]: 确认文件名无误后，点击 "下载文件" 按钮，即可一键将解码还原的原始文件保存至本地设备。系统会根据文件类型自动匹配正确的 MIME 类型及文件扩展名，完整保留原始数据，无损导出。下载过程在本地完成，文件不会上传至任何服务器，充分保障数据安全与隐私。
        - paragraph [ref=e187]:
          - text: 🗑️
          - strong [ref=e188]: 清空重置
        - paragraph [ref=e189]: 使用完毕点击“清空数据”按钮，即可一键清空文本框中的Base64编码、文件名设置以及解析结果，页面恢复初始空白状态，方便随时处理下一组Base64编码数据。
