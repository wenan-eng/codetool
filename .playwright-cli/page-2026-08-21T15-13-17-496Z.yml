        - generic [ref=e271]:
          - heading "🔍 文本分割工具支持哪些分隔符？" [level=3] [ref=e272]
          - paragraph [ref=e273]: 本工具全面支持各种字符作为分隔符，包括但不限于：逗号（,）、分号（;）、竖线（|）、制表符（Tab）、空格、换行符等特殊字符。系统会自动处理用户输入的任何分隔符，如果未指定分隔符，将默认按换行符进行分割，确保满足不同文本格式的处理需求。
        - generic [ref=e274]:
          - heading "📄 工具最多能处理多少文本内容？" [level=3] [ref=e275]
          - paragraph [ref=e276]: 本工具设计为处理大规模文本数据，单次可处理数万字符的文本内容，分割后的项目数量理论无上限。实际处理能力取决于用户设备的浏览器性能，建议在处理超大文本时先进行小批量测试，确保分割效果符合预期后再进行完整操作。
        - generic [ref=e277]:
          - heading "⚡ 分割后的数据如何快速使用？" [level=3] [ref=e278]
          - paragraph [ref=e279]: 分割完成后，每个项目都会以独立的列表项形式展示。您可以直接点击任意列表项，系统会立即将该项目的完整内容复制到剪贴板，并给出视觉反馈（文字变为灰色）。无需手动选择文本或使用快捷键，大大提高了数据提取的效率。
        - generic [ref=e280]:
          - heading "🔄 为什么已复制的项目会变成灰色？" [level=3] [ref=e281]
          - paragraph [ref=e282]: 这是特意设计的视觉反馈机制，目的是帮助用户清晰区分已复制和未复制的项目，避免重复操作。灰色状态仅在同一会话中有效，当您重新分割文本或刷新页面时，所有项目都会恢复为原始颜色。如需再次复制相同项目，请先清空数据重新分割。
        - generic [ref=e283]:
          - heading "📱 工具是否支持移动端设备？" [level=3] [ref=e284]
          - paragraph [ref=e285]: 是的，本工具采用响应式设计，完全兼容各类移动设备和平板电脑。在手机或平板上使用时，操作界面会自动适配屏幕尺寸，所有功能均正常可用。移动端的复制操作同样便捷，点击列表项即可完成复制，无需长按或特殊操作。
        - generic [ref=e286]:
          - heading "🔒 工具是否会上传用户的文本数据？" [level=3] [ref=e287]
          - paragraph [ref=e288]: 我们郑重承诺，本工具的所有处理都在本地浏览器中完成，不会将您的任何文本数据上传到服务器。您的隐私数据完全由浏览器本地处理，分割操作结束后不会在网络上留下任何痕迹。您可以在离线环境下放心使用本工具处理敏感信息。
