            - text: 是 HTML 实体编码，主要用于网页中安全展示特殊字符与代码片段；而
            - code [ref=e307]: "%XX"
            - text: 是 URL 百分号编码，用于在网址中传输参数。两者用途不同：前者用于页面展示防解析，后者用于链接传输。本工具专注于
            - strong [ref=e308]: HTML 实体编码/解码
            - text: ，适用于网页开发与内容展示场景。
        - generic [ref=e309]:
          - heading "⚡ 为什么选择 HTML 实体编码而不是其他编码方式？" [level=3] [ref=e310]
          - paragraph [ref=e311]: HTML 实体编码是前端与内容展示场景的标准方案：它能安全显示 HTML 敏感字符而不触发标签解析，避免页面错乱、XSS 风险与文本乱码，同时完全兼容所有浏览器与富文本编辑器。在需要展示代码、特殊符号、多语言内容时，HTML 实体是最通用、最稳定的解决方案。
        - generic [ref=e312]:
          - heading "🔒 输入的内容会被发送到服务器吗？安全吗？" [level=3] [ref=e313]
          - paragraph [ref=e314]: 不会！本工具所有处理逻辑均在您的浏览器本地执行，全程不发起任何网络请求，也不依赖后端接口。输入内容绝不会上传至服务器，更不会被记录、存储或追踪，全方位保障您的数据隐私与信息安全，即便完全断网也能流畅稳定使用。
