        - paragraph [ref=e220]:
          - text: 🔐
          - strong [ref=e221]: 输入JavaScript源代码
        - paragraph [ref=e222]:
          - text: 在「输入代码」文本区域中粘贴或输入需要保护的 JavaScript 代码，操作简单便捷。支持
          - code [ref=e223]: .js、.ts、.jsx
          - text: 格式文件上传，代码内容将全程在本地浏览器环境中处理，不经过服务器传输，确保源码隐私与安全。系统自动识别并保留代码原有结构与语法逻辑，为后续混淆加密做好充分准备。
        - paragraph [ref=e224]:
          - text: 🛡️
          - strong [ref=e225]: 选择混淆保护等级
        - paragraph [ref=e226]: 通过下拉菜单直观选择适合的混淆模式：「简单混淆模式」提供基础保护与快速处理，满足轻量防护需求；「标准混淆模式」（推荐）平衡安全性与性能，适合大多数场景；「高级混淆模式」提供最强的反调试与反编译保护，适用于高要求的商业代码保护。
        - paragraph [ref=e227]:
          - text: 🌐
          - strong [ref=e228]: 设置授权域名绑定
        - paragraph [ref=e229]: 在「授权域名」输入框中填写允许运行代码的合法域名（例如：lanren-tools.com，支持单 / 多个域名填写）。系统将自动且安全地绑定代码运行权限至指定域名，支持子域名匹配与本地开发环境（localhost/127.0.0.1），实现精准可控的访问控制，有效防止代码被非法调用。
        - paragraph [ref=e230]:
          - text: 🚫
          - strong [ref=e231]: 配置盗用防护机制
        - paragraph [ref=e232]: 选择代码被盗用时的应对保护方式：「弹窗提醒」会直接显示醒目警告信息震慑盗用者；「静默跳转」将自动无痕重定向至指定授权页面；「密码验证」则强制要求输入正确密码后才可运行代码。三种不同防护机制各有侧重，可灵活适配不同的安全需求与业务场景。
        - paragraph [ref=e233]:
          - text: 📝
          - strong [ref=e234]: 自定义防护提示内容
        - paragraph [ref=e235]: 根据所选防护机制，在下方专属输入框中按需设置对应的提示信息：弹窗警告文本、跳转目标链接或验证密码。系统全面支持中英文双语提示内容，可自定义个性化警示语句，并会自动根据选定防护机制智能切换输入字段类型与格式验证规则，有效规避无效输入。
        - paragraph [ref=e236]:
          - text: ⏰
          - strong [ref=e237]: 设置提醒频率策略
        - paragraph [ref=e238]: 配置代码盗用检测的提醒频率，灵活应对不同防护需求：「高频提醒」每次非法访问都立即触发警示；「适中提醒」（推荐）每天首次非法访问触发提醒；「低频提醒」每周仅触发一次提醒；「只提醒一次」首次检测到盗用后不再提醒。所有频率策略均通过本地缓存存储实现，轻量化运行且完全不影响代码性能。
        - paragraph [ref=e239]:
          - text: 💬
          - strong [ref=e240]: 添加代码头部注释
        - paragraph [ref=e241]: 在「代码注释」输入框中输入将在混淆后代码顶部固定显示的提示信息，可自由用于声明代码版权归属、使用约束条款或安全警示内容。注释将以清晰的 // 单行格式自动添加，全程不参与混淆压缩过程，既能保持良好可读性，又可充分发挥法律声明效力。
        - paragraph [ref=e242]:
          - text: 🔧
          - strong [ref=e243]: 执行代码混淆加密
        - paragraph [ref=e244]: 点击「混淆加密」按钮，系统将根据你配置的所有参数，即刻在本地高效执行完整的代码混淆、压缩与安全加固处理流程，快速生成高安全性的受保护 JavaScript 代码，并直接输出至「输出结果」区域。整个过程无需联网、无数据留存，从源头切实确保代码隐私与安全性。
