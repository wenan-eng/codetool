          - heading "✔️ 什么是Escape编码？它有什么用途？" [level=3] [ref=e293]
          - paragraph [ref=e294]:
            - text: Escape编码是一种早期的字符编码方式，通过百分号加十六进制数字（如
            - code [ref=e295]: "%20"
            - text: 表示空格，
            - code [ref=e296]: "%u4E2D"
            - text: 表示中文字符）来表示特殊字符和非ASCII字符。它曾是JavaScript的标准编码函数，现在主要用于处理遗留系统数据、学习编码原理和理解字符编码发展历史。
        - generic [ref=e297]:
          - heading "📌 Escape编码支持哪些字符？" [level=3] [ref=e298]
          - paragraph [ref=e299]:
            - text: Escape编码支持
            - strong [ref=e300]: 所有ASCII字符
            - text: ，对字母数字字符（A-Z, a-z, 0-9）不编码，对特殊字符（如空格、标点符号）编码为
            - code [ref=e301]: "%XX"
            - text: 格式，对非ASCII字符（如中文、日文等Unicode字符）编码为
            - code [ref=e302]: "%uXXXX"
            - text: 格式。需要注意的是，Escape编码已被现代标准淘汰。
        - generic [ref=e303]:
          - heading "📚 Escape编码在实际中有哪些应用场景？" [level=3] [ref=e304]
          - paragraph [ref=e305]:
