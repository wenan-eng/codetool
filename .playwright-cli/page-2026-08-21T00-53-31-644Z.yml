          - heading "🎓 Escape编码与现代编码标准有什么区别？" [level=3] [ref=e321]
          - paragraph [ref=e322]:
            - text: 主要区别包括：
            - strong [ref=e323]: Escape编码已废弃
            - text: ，而URL编码（encodeURIComponent）是现代标准；
            - strong [ref=e324]: Unicode处理方式不同
            - text: （Escape用%uXXXX，URL编码用UTF-8多字节）；
            - strong [ref=e325]: 字符覆盖范围不同
            - text: ；
            - strong [ref=e326]: 标准化程度不同
            - text: 。建议新项目使用标准的URL编码而非Escape编码。
