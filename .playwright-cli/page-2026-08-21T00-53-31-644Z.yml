            - strong [ref=e315]: 混合使用不同编码标准
            - text: （如与URL编码混淆）、
            - strong [ref=e316]: 包含无效的Unicode序列
            - text: 、或
            - strong [ref=e317]: 编码字符串被损坏
            - text: 。请确保输入的Escape编码符合标准格式：特殊字符为
