          - text: 使用说明
        - paragraph [ref=e202]:
          - text: 🔐
          - strong [ref=e203]: 输入明文或密文
        - paragraph [ref=e204]: 在对应输入区域中填写需处理的文本内容。加密操作请于“输入原文”框内填入待加密的明文信息；解密操作则请在“输入密文”框中粘贴已加密的密文数据。系统支持标准Base64编码及JSON格式密文输入，可自动识别加密模式与参数，确保各类DES加密结果均可准确解析。
        - paragraph [ref=e205]:
          - text: 🗝️
          - strong [ref=e206]: 设置加密密钥
        - paragraph [ref=e207]: 在“输入密钥”框中填入本次加解密所使用的对称密钥。DES要求密钥长度严格为8个字符（8字节），不足或多出将导致加解密失败。所有密钥内容均在本地浏览器环境中处理，不会上传至任何服务器，保障用户数据安全。
        - paragraph [ref=e208]:
          - text: ⚙️
          - strong [ref=e209]: 选择加密模式
        - paragraph [ref=e210]: 通过下拉菜单选择所需的加密算法模式：CBC（推荐）或 ECB（不安全）。其中CBC模式提供更好的安全性，而ECB因相同明文块生成相同密文块，存在信息泄露风险，仅建议用于学习或兼容旧系统。
        - paragraph [ref=e211]:
          - text: 🔢
          - strong [ref=e212]: 配置初始向量（IV）
        - paragraph [ref=e213]: 对于CBC模式，请在“初始向量”输入框中填写16位十六进制字符（对应8字节IV）。用户可手动输入，也可点击「生成随机IV」按钮由系统自动生成安全随机向量。ECB模式无需IV，切换时将自动隐藏该输入项。
        - paragraph [ref=e214]:
          - text: 📤
          - strong [ref=e215]: 执行加密或解密
        - paragraph [ref=e216]: 完成参数设置后，点击「生成密文」或「生成明文」按钮，系统将基于所选密钥、模式与IV参数，在本地执行完整的DES加解密运算，并将结果以JSON格式输出至下方结果框中。整个过程无需联网，所有数据均保留在客户端，安全可靠。
        - paragraph [ref=e217]:
          - text: 📋
          - strong [ref=e218]: 复制或清空结果
        - paragraph [ref=e219]: 加密或解密完成后，可通过「复制结果」按钮一键复制输出内容，便于后续使用或调试。如需重新开始操作，点击「清空数据」即可清除当前页所有输入项与结果，保持界面整洁高效。
