          - img [ref=e299]
          - text: 常见问题
        - generic [ref=e303]:
          - heading "🔐 这个工具支持哪些DES加密模式？" [level=3] [ref=e304]
          - paragraph [ref=e305]: 本工具支持两种常用DES加密模式：CBC（推荐）和 ECB。其中 CBC 模式通过初始向量（IV）增强安全性，适用于大多数数据加解密场景；ECB 模式因相同明文块会生成相同密文块，存在信息泄露风险，系统已标注“不安全”，仅建议用于学习演示或旧系统兼容，请勿在生产环境中使用。
        - generic [ref=e306]:
          - heading "🔑 加密时如何正确设置密钥？有什么要求？" [level=3] [ref=e307]
          - paragraph [ref=e308]: DES 加密要求密钥长度严格为 8 个字符（即 8 字节）。输入不足或多出的字符将被截断或补全，可能导致加解密失败。请确保加密与解密时使用相同的 8 字符密钥。所有密钥内容均在本地浏览器中处理，不会上传至任何服务器，保障用户数据安全。
        - generic [ref=e309]:
          - heading "🔢 什么是初始向量（IV）？必须填写吗？" [level=3] [ref=e310]
          - paragraph [ref=e311]: 初始向量（IV）是 CBC 模式中用于提升加密随机性的关键参数，可防止相同明文生成重复密文，提高安全性。在 CBC 模式下必须填写一个合法的 16 位十六进制字符串（对应 8 字节 IV）。系统支持点击「生成随机IV」按钮自动创建安全IV。而 ECB 模式不需要 IV，切换时输入框会自动隐藏，避免误操作。
        - generic [ref=e312]:
          - heading "📋 密文输出是什么格式？能直接用于其他系统吗？" [level=3] [ref=e313]
          - paragraph [ref=e314]: 加密结果以标准 JSON 格式输出，包含 Base64 编码的密文、使用的 IV（CBC 模式）、加密模式等完整信息，结构清晰且易于解析。同时兼容纯 Base64 密文内容，确保与其他平台、接口或遗留系统的无缝对接。用户可根据需要复制任意一种格式进行传输或存储。
