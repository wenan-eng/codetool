        - generic [ref=e307]:
          - heading "🏦 等额本息和等额本金有什么区别？" [level=3] [ref=e308]
          - paragraph [ref=e309]: 等额本息还款法的核心特征是每月偿还的本息总额保持不变，采用复利计算原理，还款初期利息占比高、本金占比低，随着时间推移本金占比逐渐增加，利息逐渐减少。这种方式适合追求还款稳定性、现金流规划明确且收入相对稳定的借款人，便于家庭长期财务预算管理。
        - generic [ref=e310]:
          - heading "💰 选择等额本金真的能节省更多利息吗？" [level=3] [ref=e311]
          - paragraph [ref=e312]: 是的，在相同贷款条件下，等额本金的总利息确实比等额本息更少。这是因为等额本金每月偿还固定本金，本金减少速度更快，因此利息基数下降得更快。但要注意的是，等额本金前期月供压力较大，适合现金流充裕的借款人。
        - generic [ref=e313]:
          - heading "📅 贷款期限最长可以设置多少年？" [level=3] [ref=e314]
          - paragraph [ref=e315]: 工具支持1-30年的标准贷款期限选择范围，对应12-360期还款周期，全面覆盖住房按揭贷款、汽车消费贷款、个人经营贷款等主流金融产品的期限要求，可满足从短期周转到长期投资的多元化贷款计算需求。
        - generic [ref=e316]:
          - heading "🔍 还款明细表中最后一期的本金和利息如何计算？" [level=3] [ref=e317]
          - paragraph [ref=e318]: 最后一期的计算会进行特殊处理与尾差调整：系统会根据剩余本金重新精算当月利息，然后相应调整本金偿还额，确保最后一期还款后剩余本金精确归零。这样做避免了因前期四舍五入导致的累计尾差问题，完全符合商业银行的实际操作规范与会计准则。
        - generic [ref=e319]:
          - heading "💾 下载的TXT报告包含哪些内容？" [level=3] [ref=e320]
          - paragraph [ref=e321]: 生成的TXT格式贷款计算报告采用标准化财务文档结构，完整包含贷款基础参数配置、计算结果核心指标摘要，以及全周期的逐期还款明细数据表。报告采用规范的表格化数据格式，支持直接打印存档、导入Excel进行深度财务分析，或作为正式文件提交给金融机构用于贷款审批和还款计划确认。
        - generic [ref=e322]:
