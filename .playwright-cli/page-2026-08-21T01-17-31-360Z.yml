        - heading "常见问题" [level=2] [ref=e288]:
          - img [ref=e289]
          - text: 常见问题
        - generic [ref=e293]:
          - heading "✔️ 生成的密码会确保包含我勾选的所有字符类型吗？" [level=3] [ref=e294]
          - paragraph [ref=e295]: 会的，工具会强制保证你勾选的每类字符都至少出现一个，绝不会出现缺少某类字符的情况。若密码长度小于所选类型数量，系统会自动提示错误，确保生成的密码符合网站、系统要求的强密码规范，有效提升账号安全等级，避免因密码复杂度不足导致的安全风险。
        - generic [ref=e296]:
          - heading "📌 如何生成固定长度的密码？" [level=3] [ref=e297]
          - paragraph [ref=e298]: 只需将最小长度和最大长度设置为相同数值，就会生成固定长度密码。系统支持自定义长度范围，也支持随机长度模式，满足不同平台的密码规则要求。无论设置为固定长度还是区间随机长度，工具都会严格遵循所选的字符类型要求，确保每一条密码都具备足够复杂度与安全强度，符合各类账号、系统的口令安全标准。
        - generic [ref=e299]:
          - heading "🎯 手动修改字符集后，勾选框还会同步吗？" [level=3] [ref=e300]
          - paragraph [ref=e301]: 不会同步，一旦手动编辑字符集，工具会进入自定义模式，不再跟随勾选框自动更新。此时输入框仅保留你自定义的字符内容，能更灵活地定制专属字符集。如需恢复勾选框控制，只需点击清空数据按钮重置即可，界面会回到默认状态，重新启用自动同步功能，方便你在预设与自定义模式之间自由切换。
        - generic [ref=e302]:
          - heading "🔁 一次最多可以生成多少条密码？" [level=3] [ref=e303]
          - paragraph [ref=e304]: 工具支持批量生成多条密码，你可根据需求自由设置数量，系统会自动校验数值合法性，不允许小于等于 0 的数字。数量设置完成后点击生成按钮即可一次性产出，生成的所有密码都会在输出框内按顺序展示，支持直接复制使用，批量操作高效便捷，适合需要大量密码的场景。
        - generic [ref=e305]:
          - heading "🔒 密码生成过程会上传数据吗？" [level=3] [ref=e306]
          - paragraph [ref=e307]: 不会，本工具所有生成逻辑均在本地浏览器完成，不发送任何网络请求，不记录、不上传任何密码内容，断网状态下也能正常使用。你的所有设置和生成结果仅保存在当前页面，关闭页面即清空，最大限度保障密码隐私与数据安全。
