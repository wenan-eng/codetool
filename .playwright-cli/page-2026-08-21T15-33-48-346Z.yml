            - paragraph [ref=e328]: 本工具能够解析绝大多数常见的URL格式，包括：标准的HTTP和HTTPS网址、FTP文件传输地址、mailto邮件链接、WebSocket连接地址等。无论是简单的网站链接，还是包含用户名密码认证、IPv6地址、特殊字符或国际化域名的复杂URL，都能够准确解析并展示各个组件。
          - generic [ref=e329]:
