        - generic [ref=e275]:
          - heading "✔️ 什么是中文符号和英文符号转换？这个工具有什么用途？" [level=3] [ref=e276]
          - paragraph [ref=e277]: 中文符号与英文符号转换是将文本中的标点符号在中英文标点体系之间进行相互转换的过程。本工具可快速实现标点符号的双向转换，广泛应用于国际化文档处理、跨语言内容创作、代码注释规范化、学术论文排版以及多语言网站本地化等场景，能够有效提升文本在不同语言环境下的兼容性和规范性。
        - generic [ref=e278]:
          - heading "📌 哪些类型的符号支持转换？转换规则是怎样的？" [level=3] [ref=e279]
          - paragraph [ref=e280]: 本工具支持逗号、句号、问号、感叹号、冒号、分号、引号、括号、书名号等常用标点符号的转换。中文符号转英文时会按照国际通用标点规范进行映射，例如将中文逗号转换为英文逗号，将中文句号转换为英文句号，将中文引号转换为半角双引号，将书名号转换为尖括号，确保转换后的英文标点符号符合国际排版标准和写作规范。
