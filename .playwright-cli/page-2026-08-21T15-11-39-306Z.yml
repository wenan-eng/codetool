        - paragraph [ref=e179]: 在【请输入要转换英文符号/中文符号的文本内容】输入框中，您可自由粘贴或输入任意包含标点符号的文本内容。本工具全面支持中英文混合文本、数字、各类标点符号及带格式文本，系统将自动识别并准备进行精准的符号转换处理，确保所有标点符号均能被正确识别与转换。
        - paragraph [ref=e180]:
          - text: 🔄
          - strong [ref=e181]: 英文符号
        - paragraph [ref=e182]: 点击 "英文符号" 按钮后，系统将立即启动转换流程，将您输入文本中的所有中文标点符号（如逗号、句号、引号、括号等）精准转换为对应的英文标点符号。该功能会自动处理中英文标点差异，例如将中文逗号 "，" 转换为英文逗号 ","，确保输出结果符合英文写作规范。
        - paragraph [ref=e183]:
          - text: 🔄
          - strong [ref=e184]: 中文符号
        - paragraph [ref=e185]: 点击 "中文符号" 按钮后，系统将您输入文本中的所有英文标点符号精准转换为对应的中文标点符号。该功能会自动处理常见英文标点与中文标点的对应关系，例如将英文句号 "." 转换为中文句号 "。"，将英文引号转换为中文引号，确保输出结果完全符合中文书写标准与排版要求。
        - paragraph [ref=e186]:
          - text: 📋
          - strong [ref=e187]: 复制结果
        - paragraph [ref=e188]: 转换完成后，结果将实时显示在下方【输出的中文符号/英文符号...】文本区域中。点击 "复制结果" 按钮即可一键将转换后的文本复制到剪贴板，方便您快速粘贴到文档、邮件、社交媒体或其他编辑环境中进行后续使用和分享。
        - paragraph [ref=e189]:
          - text: 🗑️
          - strong [ref=e190]: 清空数据
        - paragraph [ref=e191]: 点击 "清空数据" 按钮，可同时清除输入框与输出区域的所有内容，恢复工具至初始状态。所有转换过程均在浏览器本地完成，不上传任何数据至服务器，充分保护用户隐私安全，让您放心使用本工具进行各类标点符号转换工作。
