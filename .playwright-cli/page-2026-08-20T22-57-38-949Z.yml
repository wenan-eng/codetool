          - paragraph [ref=e296]:
            - text: 驼峰命名法（camelCase）指单词首字母大写、中间无分隔符的命名方式，如
            - code [ref=e297]: userName
            - text: ；下划线命名法（snake_case）指单词间用下划线连接的命名方式，如
            - code [ref=e298]: user_name
            - text: 。两者是编程中最常用的两种变量命名规范。
