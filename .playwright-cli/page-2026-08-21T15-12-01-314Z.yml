        - paragraph [ref=e228]:
          - text: 🧠
          - strong [ref=e229]: 统计字数
        - paragraph [ref=e230]: 字数统计基于“可见字符”原则，仅计算用户可直观看到的内容字符，不包含任何空白字符（如空格、换行符 \n、回车符 \r、制表符 \t 等）。每个汉字、字母、数字、标点符号均按一个字符计算，Emoji 表情（如 😊、🚀、❤️）也视为一个独立字符参与统计。
        - paragraph [ref=e231]: 统计结果真实反映文本内容量，符合人工阅读感知，适用于写作、投稿、发布等实际场景。
        - paragraph [ref=e232]:
          - text: 💡
          - strong [ref=e233]: 查看示例
        - paragraph [ref=e234]: 点击后自动填充一组包含中文、英文、标点符号、数字以及 Emoji 表情等多种形式的内容样本，涵盖换行、空格混排、标点夹杂等常见文本混乱场景。通过统计不同字符类型的数量，帮助用户快速了解工具的输入方式与处理能力。
        - paragraph [ref=e235]: 示例内容真实反映中英文混合文本的复杂性，便于新用户直观理解本工具在字数、行数、符号分类等方面的精准识别效果，降低使用门槛。
        - paragraph [ref=e236]:
          - text: 📥
          - strong [ref=e237]: 下载TXT
        - paragraph [ref=e238]: 将字数统计结果以纯文本（.txt）格式下载到本地。文件包含总字数、行数、中文字数、字母个数、单词个数、标点符号、数字、Emoji等完整统计项，按清晰结构排版，无多余格式或编码问题。适用于数据存档、报告引用、跨平台分享等场景，兼容各类文本编辑器，开箱即用。
        - paragraph [ref=e239]:
          - text: 📋
          - strong [ref=e240]: 复制结果
        - paragraph [ref=e241]: 一键将字数统计结果复制到系统剪贴板。复制内容包含总字数、行数、中文字数、字母个数、单词个数、标点符号、数字、Emoji等完整统计信息，按清晰结构排版，确保粘贴时保留完整格式，可直接用于报告撰写、文档归档或消息发送。无需手动输入或调整布局，简化操作流程，特别适合高频使用的办公与写作场景。
        - paragraph [ref=e242]:
          - text: 🗑️
          - strong [ref=e243]: 清空数据
        - paragraph [ref=e244]: 清除输入框与结果区域的所有内容，重置统计数字（总字数、行数、中文字数、字母个数、单词个数、标点符号、数字、Emoji等）为 0。一键还原初始状态，方便用户切换任务或重新开始新一轮文本统计，操作安全便捷。
