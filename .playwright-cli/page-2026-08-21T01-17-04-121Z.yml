        - generic [ref=e282]:
          - heading "✔️ 什么是 Base64 编码？什么时候需要用到它？" [level=3] [ref=e283]
          - paragraph [ref=e284]: Base64 是一种可将图片、字体等二进制数据，转换成标准 ASCII 字符串的编码格式。它能把非文本资源转为纯文本形式，适配仅支持文本传输、存储的各类场景，方便在网页、接口配置、文案传输中直接嵌入资源，解决二进制文件无法直接传递的适配难题。
        - generic [ref=e285]:
          - heading "📌 文本和图片都能进行 Base64 转换吗？" [level=3] [ref=e286]
          - paragraph [ref=e287]: 本工具全面支持普通文本与图片文件的 Base64 双向互转功能。文本可直接粘贴输入一键转换，图片支持本地上传和拖拽上传两种导入方式，兼容 PNG、JPG、GIF、WebP 等市面主流图片格式，全程操作简单易用，无需安装任何额外软件，即可快速完成专业的编码与解码处理。
        - generic [ref=e288]:
          - heading "🎯 如何生成 Data URL？有什么用途？" [level=3] [ref=e289]
          - paragraph [ref=e290]:
            - text: 只需上传本地图片，工具便会自动生成以
            - code [ref=e291]: data:image/
            - text: 开头的标准 Data URL 格式字符串。该链接可直接嵌入 HTML、CSS 代码中使用，无需额外发起网络请求，能够有效减少网页 HTTP 请求数量，精简资源加载流程，小幅提升页面整体加载与渲染速度。
        - generic [ref=e292]:
          - heading "🔭 图片转 Base64 后会不会很大？影响性能吗？" [level=3] [ref=e293]
          - paragraph [ref=e294]: 图片经过 Base64 编码后，体积相比原文件会增大约 33%，整体文件体量明显膨胀冗余。建议仅对 10KB 以内的小图标、装饰小素材进行 Base64 内嵌使用，高清大图与大图资源不建议转换嵌入，否则会大幅增加页面代码体积、拖慢加载速度，进而拉低网站整体访问体验与运行性能。
        - generic [ref=e295]:
          - heading "🔒 所有计算是在本地完成的吗？数据安全吗？" [level=3] [ref=e296]
          - paragraph [ref=e297]: 本工具所有 Base64 编码、解码及图片读取处理，全部在用户本地浏览器内离线完成。全程无需后端服务器参与、不上传任何文本和图片数据，不会留存用户隐私内容，从源头保障个人文件、私密文案与敏感数据的使用安全。
