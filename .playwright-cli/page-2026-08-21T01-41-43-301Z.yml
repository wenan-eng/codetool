        - generic [ref=e277]:
          - heading "✔️ 什么是 MySQL 密码哈希？为什么需要它？" [level=3] [ref=e278]
          - paragraph [ref=e279]:
            - text: MySQL 密码哈希（MySQL Password Hash）是将明文密码通过双重 SHA1 算法转换为以
            - code [ref=e280]: "*"
            - text: 开头的41位十六进制字符串的安全存储格式。数据库不会保存明文密码，使用哈希值可大幅降低密码泄露风险，是 MySQL 最经典、最常用的密码安全机制。
        - generic [ref=e281]:
          - heading "📌 该工具生成的哈希值兼容哪些 MySQL 版本？" [level=3] [ref=e282]
          - paragraph [ref=e283]:
            - text: 本工具生成的密码哈希严格遵循 MySQL 5.x 系列原生
            - code [ref=e284]: PASSWORD()
            - text: 函数实现标准，与官方加密逻辑完全一致，可完美兼容 MySQL 5.5、5.6、5.7 等主流版本。在 MySQL 8.0 及以上版本中，只需将用户认证插件切换为
            - code [ref=e285]: mysql_native_password
            - text: ，即可正常使用该哈希值进行密码配置与登录验证。
        - generic [ref=e286]:
          - heading "🎯 什么时候需要手动生成 MySQL 密码哈希值？" [level=3] [ref=e287]
          - paragraph [ref=e288]: 在数据库迁移、批量用户初始化、离线密码重置、自动化脚本部署等场景中，通常需要提前生成密码哈希。手动生成哈希可避免明文密码暴露在配置文件、脚本或日志里，有效降低敏感信息泄露风险，进一步提升整体数据库运维安全等级与规范化水平。
        - generic [ref=e289]:
          - heading "🔭 生成的哈希值可以直接用于 MySQL 密码设置吗？" [level=3] [ref=e290]
          - paragraph [ref=e291]:
            - text: 可以直接使用。生成的哈希格式与 MySQL 官方标准完全一致，可直接用于
            - code [ref=e292]: ALTER USER、SET PASSWORD
            - text: 等官方授权语句。无需二次处理、无需额外加密，复制粘贴后即可快速完成数据库账号密码配置，使用简单高效。
        - generic [ref=e293]:
          - heading "📚 本工具与 MySQL 自带的 PASSWORD() 函数结果一致吗？" [level=3] [ref=e294]
          - paragraph [ref=e295]:
            - text: 完全一致。本工具严格实现 MySQL 5.x 官方双重 SHA1 加密逻辑：先对明文密码做一次 SHA1 运算，再对结果执行二次 SHA1，最终添加
            - code [ref=e296]: "*"
            - text: 前缀并转为大写，与 MySQL 原生
            - code [ref=e297]: PASSWORD()
            - text: 函数生成的哈希值完全一致，可直接替换使用。
