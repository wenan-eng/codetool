        - paragraph [ref=e187]: 点击 "生成密码" 按钮，系统会将输入的明文密码按照 MySQL 5.x 标准规则（SHA1(SHA1(明文))+*前缀）转换为哈希格式。适用于 MySQL 用户密码设置、数据库迁移、密码批量配置等场景，确保密码符合 MySQL 存储规范，且生成过程全程无延迟。
