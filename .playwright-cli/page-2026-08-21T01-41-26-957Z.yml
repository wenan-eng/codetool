          - img [ref=e289]
          - text: 常见问题
        - generic [ref=e293]:
          - heading "🔐 什么是 SHA 加密？" [level=3] [ref=e294]
          - paragraph [ref=e295]: SHA（Secure Hash Algorithm，安全散列算法）是由美国国家安全局（NSA）设计，并由美国国家标准与技术研究院（NIST）发布的一系列密码学标准散列函数。该算法可将任意长度的输入数据，通过特定计算，生成一个唯一且固定长度的 "数字指纹"（即哈希值）。
        - generic [ref=e296]:
          - heading "🔑 SHA 加密一般用在哪些场景？" [level=3] [ref=e297]
          - paragraph [ref=e298]: SHA 系列算法是标准的密码哈希函数，它将任意长度的数据映射为固定长度的 "数字指纹"。这种特性使其被广泛用于保障数据完整性、验证文件来源、安全存储用户密码凭证及构建区块链等可信系统中。
        - generic [ref=e299]:
          - heading "⚙️ SHA-1、SHA-224、SHA-256、SHA-384、SHA-512 这些算法有什么区别？如何选择？" [level=3] [ref=e300]
          - paragraph [ref=e301]:
            - text: 这些是不同输出长度的SHA算法变体。SHA-1（160位）已不安全，仅用于兼容旧系统。
            - code [ref=e302]: SHA-224/256/384/512
            - text: 同属更安全的 SHA-2 家族，数字代表其输出的位长度。SHA-256 是当前最通用的推荐标准；需要更高安全性时可选择 SHA-512；SHA-224/384 是其对应的截断版本，适用于特定空间或协议要求。
        - generic [ref=e303]:
          - heading "🔠 生成的哈希值为什么区分大小写？应该选择大写还是小写？" [level=3] [ref=e304]
          - paragraph [ref=e305]: 哈希值作为十六进制字符串，其大小写形式在计算机中是两种不同的字符，因此对比时必须完全一致。行业通行惯例是使用小写格式。本工具同时提供大小写输出选项，但在与其他系统或官方校验值进行比对时，请确保格式统一，通常建议使用小写标准格式。
        - generic [ref=e306]:
          - heading "🔒 使用这个 SHA 哈希工具安全吗？会不会上传我的数据？" [level=3] [ref=e307]
          - paragraph [ref=e308]: 所有加解密操作均在浏览器本地完成，无需联网，不调用任何后端接口，不会收集、存储或上传您的明文、密钥、密文及初始向量。所有数据始终保留在您自己的设备上，从根本上杜绝泄露风险，保障数据隐私与通信安全。
