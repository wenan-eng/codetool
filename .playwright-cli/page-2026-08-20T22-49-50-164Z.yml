          - text: 使用说明
        - paragraph [ref=e240]:
          - text: 🔢
          - strong [ref=e241]: 选择输入进制
        - paragraph [ref=e242]: 在“请选择进制类型”区域中，点击选择你当前要输入的数值所属的进制，支持：二进制、八进制、十进制、十六进制、三十二进制、三十六进制，以及扩展进制（52/58/62/64进制）。系统将根据所选进制正确解析输入内容。
        - paragraph [ref=e243]:
          - text: ⌨️
          - strong [ref=e244]: 输入待转换数值
        - paragraph [ref=e245]: 在输入框中填写对应进制下的有效数值。例如：选择“二进制”时请输入仅含 0 和 1 的字符串；选择“十六进制”时可输入 0-9 与 A-F 字符；选择 Base58 等扩展进制时，请确保不包含易混淆字符（如 0、O、I、l）。
        - paragraph [ref=e246]:
          - text: 🔄
          - strong [ref=e247]: 执行进制转换
        - paragraph [ref=e248]: 点击“进制转换”按钮后，系统会将你输入的数值先转换为十进制基准，再自动计算并显示其在其他所有支持进制下的等效表示。结果以只读输入框形式展示，方便手动选中复制。
        - paragraph [ref=e249]:
          - text: 📋
          - strong [ref=e250]: 查看与复制结果
        - paragraph [ref=e251]: 转换完成后，下方表格会列出从 2 进制到 64 进制的各项结果。每个结果均位于可编辑样式的输入框中（实际为 readonly），你可以点击任意结果框并使用 Ctrl+C（或右键复制）将其粘贴至其他位置使用。
        - paragraph [ref=e252]:
          - text: 🗑️
          - strong [ref=e253]: 清空数据
        - paragraph [ref=e254]: 点击“清空数据”按钮，可一键清除输入框内容及所有转换结果，恢复工具至初始状态，便于进行下一次独立操作。
