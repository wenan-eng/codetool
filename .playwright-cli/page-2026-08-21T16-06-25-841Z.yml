        - generic [ref=e291]:
          - heading "🔢 可以生成哪些类型的数字序列？" [level=3] [ref=e292]
          - paragraph [ref=e293]: 本工具支持生成多种数字序列类型，包括常规连续数字（步长=1）、任意等差数列（自定义步长）、相同数字序列（步长=0）以及递减序列（负步长）。支持整数、小数、负数，并可通过补零和前后缀进行自定义格式化输出。
        - generic [ref=e294]:
          - heading "📐 步长差值支持哪些数值范围？" [level=3] [ref=e295]
          - paragraph [ref=e296]: 步长差值参数支持所有有效的数值类型输入，包括正整数、负整数、零以及各种小数格式。输入正步长将生成规范的递增等差数列，输入负步长则生成对应的递减数字序列，而输入步长为0时会生成完全一致的重复数字。系统会自动验证错误，确保序列生成算法规则正确。
        - generic [ref=e297]:
          - heading "🔟 补零功能具体如何工作？" [level=3] [ref=e298]
          - paragraph [ref=e299]: 补零功能针对数字的整数部分进行格式化处理，提供从2位到20位的补零选项。例如选择"补齐3位"时，数字1显示为001，数字25显示为025。补零仅影响显示格式，不影响数值计算逻辑和数学属性。
        - generic [ref=e300]:
          - heading "🎯 最多可以生成多少个数字？" [level=3] [ref=e301]
          - paragraph [ref=e302]: 出于系统性能稳定性和用户体验流畅度考虑，本工具单次最多支持生成10,000个数字序列。对于绝大多数常规应用场景需求而言，这个数量限制已完全足够满足使用需要。如果确实需要处理更大数量的数据序列，建议采用分批多次生成方式或使用专业级别的数据处理软件进行操作处理。
        - generic [ref=e303]:
          - heading "🏷️ 前后缀可以包含哪些字符？" [level=3] [ref=e304]
